<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FBF7F0" />
  <title>游戏管家</title>
  <link rel="stylesheet" href="/shared/base.css" />
</head>
<body>
  <div id="root">
    <div class="center-screen">
      <p class="muted" style="text-align:center">正在打开…</p>
    </div>
  </div>
  <script src="/shared/cursor.js"></script>
  <script>
    // 入口重定向：根据登录态和角色跳到对应页面
    fetch('/api/auth/me', { credentials: 'same-origin' })
      .then(function (res) { return res.json().catch(function () { return {}; }); })
      .then(function (data) {
        if (!data || !data.user) { location.replace('/login.html'); return; }
        location.replace(data.user.role === 'admin' ? '/admin/dashboard.html' : '/player.html');
      })
      .catch(function () { location.replace('/login.html'); });
  </script>
</body>
</html>
